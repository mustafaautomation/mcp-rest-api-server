name: Bug
description: Something in the template does not behave as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command, the tool name, and the error code. Do not paste API keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `node dist/cli.js --version` or the git SHA
    validations:
      required: true
