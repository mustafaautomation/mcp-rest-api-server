name: Feature
description: A change that makes the template easier to adapt
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: api
    attributes:
      label: Which API shape needs this
      description: Page numbers, a new auth style, a resource, and so on.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
